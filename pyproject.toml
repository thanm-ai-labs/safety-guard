[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-guard"
version = "0.1.0"
description = "Shared command/path safety guard for LLM-driven execution paths"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Thanm AI Labs" }]
keywords = ["llm", "agents", "safety", "prompt-injection", "guardrails"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["safety_guard"]
